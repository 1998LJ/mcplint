id: MCP013
title: Pinned dependency matches a known CVE (OSV)
severity: high
owasp: "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
check: known_vulnerable_dependency
targets: [config]
description: >
  A pinned npm/PyPI package referenced by a server matches a known advisory in
  OSV. This check only runs with --online, because it queries the public OSV
  API; by default nothing leaves your machine.
remediation: >
  Upgrade the package to a fixed version and re-run the scan, or run the server
  in a sandbox until an upgrade is possible.
params: {}
