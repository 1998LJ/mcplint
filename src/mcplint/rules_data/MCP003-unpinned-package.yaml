id: MCP003
title: MCP server package is not pinned to a version
severity: medium
owasp: "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
check: unpinned_package
targets: [config]
description: >
  `npx -y pkg`, `uvx pkg` and friends resolve to whatever the registry serves at
  run time. A malicious or broken release is picked up on the next run with no
  review. Auto-approved runners (npx -y) make this worse by skipping the
  confirmation prompt entirely.
remediation: >
  Pin the exact version (`pkg@1.2.3` for npm, `pkg==1.2.3` for uvx/pipx) and
  bump it deliberately.
params: {}
