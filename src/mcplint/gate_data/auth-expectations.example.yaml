# Example expectations for authenticated checks:
#   mcplint gate --auth auth-expectations.yaml https://your-gateway --allow-host
#
# Copy this file, set your target, and edit the lists. The key is read from the
# environment only — never put a real credential in this file.
#
# Checks performed (all read-only):
#   AUTH001 forbidden_tools visible to the key        (high)
#   AUTH002 tools outside expect_tools                (medium)
#   AUTH003 forbidden_servers reachable via scoping   (high)
#   AUTH004 read_probe returns data (expected deny)   (critical)
#   AUTH005 expected tools missing                    (low, config drift)
#
# Use a dedicated TEST key with a test user, not a real person's key.

target: http://localhost:4000
key: env/LITELLM_TEST_KEY

# Strict allowlist: every tool the key can see should be listed here.
# Leave the list empty (or delete it) to skip this check.
expect_tools:
  - confluence.search
  - confluence.get_page

# fnmatch patterns that must never be visible to this key.
forbidden_tools:
  - "*delete*"
  - "*update*"
  - "*admin*"

# Servers this key must not reach; probed with the x-mcp-servers header.
forbidden_servers:
  - github

# OPTIONAL and opt-in: one read-only tool call that must be denied upstream —
# use an object (page, issue, record) the test user is NOT allowed to access.
# Only put read-only tools here; write tools must never appear in this file.
# read_probe:
#   tool: confluence.get_page
#   args: { page_id: "00000000" }
#   expect: deny
